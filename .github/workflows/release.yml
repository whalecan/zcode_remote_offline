name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（如 v1.0.0；留空则用 run 号生成）"
        required: false
        default: ""

permissions:
  contents: write

env:
  GO_VERSION: "1.22.x"

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            offline/go.mod
            online/go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          CDN_OUT="zcode-cdn-mock_${GOOS}_${GOARCH}${EXT}"
          DL_OUT="download-offline-assets_${GOOS}_${GOARCH}${EXT}"

          (cd offline && go build -trimpath -ldflags="-s -w" -o "../dist/${CDN_OUT}" .)
          (cd online && go build -trimpath -ldflags="-s -w" -o "../dist/${DL_OUT}" .)

          echo "Built:"
          ls -lh dist/

      - name: Set up QEMU
        if: matrix.goos == 'linux'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v3

      - name: Build and pack Docker image
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          docker buildx build --load --platform "linux/${GOARCH}" \
            -t zcode-cdn-mock:local \
            -f offline/Dockerfile \
            offline/
          OUT="dist/zcode-cdn-mock_docker_image_linux_${GOARCH}.tar.gz"
          docker save zcode-cdn-mock:local | gzip > "${OUT}"
          ls -lh "${OUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        id: prep
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp -t release {} +
          binary_count=$(find release -maxdepth 1 -type f ! -name 'zcode-cdn-mock_docker_image_*.tar.gz' \( \
            -name 'zcode-cdn-mock_linux_*' -o \
            -name 'zcode-cdn-mock_windows_*' -o \
            -name 'download-offline-assets_linux_*' -o \
            -name 'download-offline-assets_windows_*' \
          \) | wc -l)
          test "$binary_count" -eq 8
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lah
          echo "count=$(ls -1 | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v0.0.${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 产物说明
            - **二进制**：`zcode-cdn-mock_*` / `download-offline-assets_*`
            - **Docker 镜像包**（约 2MB）：`zcode-cdn-mock_docker_image_linux_{amd64,arm64}.tar.gz`
              离线机：`docker load -i …` 后 `docker run`，详见 README。
          files: |
            release/*
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
