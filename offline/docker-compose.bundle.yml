services:
  zcode-cdn-mock:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: zcode-cdn-mock:local
    platform: linux/__GOARCH__
    container_name: zcode-cdn-mock
    ports:
      - "${PORT:-8765}:80"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    environment:
      CDN_ROOT: /data
      PORT: "80"
      BIND: "0.0.0.0"
    restart: unless-stopped
