services:
  zcode-remote-server-downloader:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: zcode-remote-server-downloader:local
    platform: linux/__GOARCH__
    container_name: zcode-remote-server-downloader
    ports:
      - "${PORT:-8765}:80"
    volumes:
      - ${DATA_DIR:-./data}:/data:ro
    environment:
      CDN_ROOT: /data
      PORT: "80"
      BIND: "0.0.0.0"
    restart: unless-stopped
